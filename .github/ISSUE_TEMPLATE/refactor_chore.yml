name: "Refactor / Chore"
description: "Tech debt, refactor, CI, deploy, atau dokumentasi"
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah mencatat pekerjaan refactor atau chore. Jelaskan masalah dan target perubahannya.

        > **Jangan menempel password, token, atau data rahasia perusahaan di issue ini.**

  - type: dropdown
    id: component
    attributes:
      label: "Komponen terdampak"
      description: "Pilih bagian Huddle yang terkait."
      options:
        - "Backend API"
        - "Frontend UI"
        - "Media / SFU"
        - "Signaling / WebSocket"
        - "Deploy / Infrastruktur"
        - "Belum tahu"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Prioritas"
      options:
        - "Tinggi"
        - "Sedang"
        - "Rendah"
    validations:
      required: true

  - type: textarea
    id: current_problem
    attributes:
      label: "Masalah saat ini"
      description: "Jelaskan kondisi yang membuat perubahan ini perlu dilakukan."
    validations:
      required: true

  - type: textarea
    id: target_state
    attributes:
      label: "Target setelah perubahan"
      description: "Jelaskan kondisi yang diharapkan setelah perubahan selesai."
    validations:
      required: true

  - type: textarea
    id: compatibility_risk
    attributes:
      label: "Risiko kompatibilitas"
      description: "Apakah mengubah kontrak API, kontrak signaling, skema database, atau konfigurasi deploy? Tulis \"Tidak ada\" bila tidak."
    validations:
      required: true

  - type: textarea
    id: done_criteria
    attributes:
      label: "Kriteria selesai"
      description: "Tulis daftar kriteria yang bisa diuji, satu per baris."
      placeholder: |
        - [ ] Kriteria pertama
        - [ ] Kriteria kedua
    validations:
      required: true

  - type: textarea
    id: large_room_impact
    attributes:
      label: "Dampak ke room besar"
      description: "Isi \"Tidak berlaku\" bila tidak menyentuh media, signaling, atau performa."
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: "Catatan tambahan"
      description: "Konteks lain yang mungkin membantu."
    validations:
      required: false
