name: "Feature Request"
description: "Usulkan kemampuan baru untuk Huddle"
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah mengusulkan fitur baru. Jelaskan kebutuhan dan dampaknya agar mudah diprioritaskan.

        > **Jangan menempel password, token, atau data rahasia perusahaan di issue ini.**

  - type: dropdown
    id: component
    attributes:
      label: "Komponen terdampak"
      description: "Pilih bagian Huddle yang terkait."
      options:
        - "Backend API"
        - "Frontend UI"
        - "Media / SFU"
        - "Signaling / WebSocket"
        - "Deploy / Infrastruktur"
        - "Belum tahu"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Prioritas"
      options:
        - "Tinggi"
        - "Sedang"
        - "Rendah"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "Latar belakang"
      description: "Jelaskan kebutuhan atau masalah yang ingin diselesaikan."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Usulan solusi"
      description: "Jelaskan solusi yang diusulkan dan cara kerjanya."
    validations:
      required: true

  - type: textarea
    id: done_criteria
    attributes:
      label: "Kriteria selesai"
      description: "Tulis daftar kriteria yang bisa diuji, satu per baris."
      placeholder: |
        - [ ] Kriteria pertama
        - [ ] Kriteria kedua
    validations:
      required: true

  - type: textarea
    id: large_room_impact
    attributes:
      label: "Dampak ke room besar"
      description: "Pertimbangkan room hingga 300 peserta dengan semua kamera dan mic menyala: dampak ke bandwidth, CPU, jumlah track, dan subscription."
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Catatan tambahan"
      description: "Konteks lain yang mungkin membantu."
    validations:
      required: false
